server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Hashed assets can be cached for a long time.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Optional: same-origin proxy to GitLab for instances that block cross-origin requests.
  # Uncomment, set your GitLab host, and enter "/gitlab" as the GitLab URL on the Connection page.
  # location /gitlab/ {
  #   proxy_pass https://gitlab.example.com/;
  #   proxy_set_header Host gitlab.example.com;
  #   proxy_ssl_server_name on;
  # }

  # Client-side routes (/g/1/overview, /wiki/group-1/page/home, ...) all serve the app.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
